# Zamzam CRM - Nginx Production Configuration
# Place this file in /etc/nginx/sites-available/zamzam-crm and symlink to /etc/nginx/sites-enabled/

# Upstream Next.js Standalone Server (Localhost only)
upstream nextjs_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP server block: Serves traffic on Port 80 & handles Certbot challenges
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN_OR_IP; # e.g., crm.zamzamproperties.in or server IP

    # ACME-challenge for Let's Encrypt / Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Optimization: Allow larger payloads for property media/document uploads
    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Next.js Static Cache (Immutable Build Assets)
    location /_next/static/ {
        alias /var/www/zamzam-crm/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public Directory Assets (Static images, icons, robots.txt, etc.)
    location /static/ {
        alias /var/www/zamzam-crm/public/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    location = /favicon.ico {
        alias /var/www/zamzam-crm/public/favicon.ico;
        access_log off;
    }

    # Reverse Proxy to Next.js Standalone
    location / {
        proxy_pass http://nextjs_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts for SSR & Server Actions
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# Note: Once you run `sudo certbot --nginx -d YOUR_DOMAIN`,
# Certbot will automatically inject SSL certificates and rewrite Port 80 to redirect to Port 443 (HTTPS).
