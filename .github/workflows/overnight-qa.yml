name: Overnight Autonomous QA Sweep

on:
  schedule:
    # Runs everyday at 20:30 UTC (2:00 AM IST)
    - cron: '30 20 * * *'
  workflow_dispatch:

jobs:
  overnight-qa:
    name: Overnight QA Sweep & Triage Generation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Generate Prisma Client
        run: bunx prisma generate

      - name: Execute Overnight QA Test Suite (Structural Guardrails Active)
        env:
          OVERNIGHT_QA: 'true'
          QA_DATABASE_URL: ${{ secrets.QA_DATABASE_URL || secrets.DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG || 'zamzam-crm' }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT || 'crm-web' }}
        run: bun test test/overnight/

      - name: Publish Morning Triage Report to GitHub Actions Summary
        if: always()
        run: |
          TODAY=$(date +%Y-%m-%d)
          if [ -f "output/qa-reports/report-${TODAY}.md" ]; then
            cat "output/qa-reports/report-${TODAY}.md" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Morning QA Triage Report & Cleanup SQL as Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-qa-triage-report
          path: output/qa-reports/
          retention-days: 14
