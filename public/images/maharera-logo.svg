<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="120" height="120">
  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="95" fill="#fdfcf7" stroke="#b43b18" stroke-width="6"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="#b43b18" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="82" fill="#d95328"/>
  <circle cx="100" cy="100" r="54" fill="#ffffff" stroke="#b43b18" stroke-width="2"/>
  
  <!-- Curved Text Top (MahaRERA) -->
  <path id="curveTop" d="M 30,100 A 70,70 0 0,1 170,100" fill="none"/>
  <text font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" letter-spacing="1.5">
    <textPath href="#curveTop" startOffset="50%" text-anchor="middle">
      MAHARASHTRA REAL ESTATE
    </textPath>
  </text>
  
  <!-- Curved Text Bottom -->
  <path id="curveBottom" d="M 168,105 A 70,70 0 0,1 32,105" fill="none"/>
  <text font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" letter-spacing="1">
    <textPath href="#curveBottom" startOffset="50%" text-anchor="middle">
      REGULATORY AUTHORITY
    </textPath>
  </text>

  <!-- Central Building Icon & Emblem -->
  <g transform="translate(100, 95) scale(0.9)">
    <!-- Base foundation -->
    <rect x="-35" y="24" width="70" height="4" fill="#b43b18"/>
    <!-- Pillars / Building blocks -->
    <rect x="-30" y="-12" width="10" height="34" fill="#b43b18"/>
    <rect x="-16" y="-18" width="10" height="40" fill="#b43b18"/>
    <rect x="-2" y="-24" width="10" height="46" fill="#b43b18"/>
    <rect x="12" y="-18" width="10" height="40" fill="#b43b18"/>
    <rect x="26" y="-12" width="10" height="34" fill="#b43b18"/>
    <!-- Roof Triangular / Arch structure -->
    <polygon points="0,-36 -35,-12 35,-12" fill="#b43b18"/>
    <!-- Center text badge MAHA RERA -->
    <rect x="-26" y="-4" width="52" height="18" fill="#ffffff" rx="2" stroke="#b43b18" stroke-width="1.5"/>
    <text x="0" y="4" font-family="Arial, Helvetica, sans-serif" font-size="7" font-weight="bold" fill="#b43b18" text-anchor="middle">MAHA</text>
    <text x="0" y="11" font-family="Arial, Helvetica, sans-serif" font-size="7" font-weight="bold" fill="#b43b18" text-anchor="middle">RERA</text>
  </g>
</svg>
