<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <defs>
    <linearGradient id="goldMetallicTrans" x1="60" y1="40" x2="260" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DFBA73" />
      <stop offset="50%" stop-color="#B38A38" />
      <stop offset="100%" stop-color="#8C641E" />
    </linearGradient>
  </defs>

  <!-- Monogram Mark -->
  <g transform="translate(60, 35) scale(0.666)" fill="url(#goldMetallicTrans)">
    <!-- Top & Outer Z -->
    <path d="M 50 50 L 250 50 L 250 72 L 118 204 L 250 204 L 250 226 L 50 226 L 50 204 L 182 72 L 50 72 Z" />
    <!-- Inner Parallel Fold -->
    <path d="M 88 108 L 112 84 L 212 184 L 188 208 Z" />
  </g>

  <!-- Typography: ZAM ZAM -->
  <text 
    x="160" 
    y="228" 
    text-anchor="middle" 
    fill="currentColor" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Cinzel', 'Montserrat', sans-serif" 
    font-size="29" 
    font-weight="800" 
    letter-spacing="5"
  >ZAM ZAM</text>

  <!-- Typography: PROPERTIES -->
  <text 
    x="160" 
    y="262" 
    text-anchor="middle" 
    fill="url(#goldMetallicTrans)" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Cinzel', 'Montserrat', sans-serif" 
    font-size="13" 
    font-weight="700" 
    letter-spacing="7" 
    opacity="0.9"
  >PROPERTIES</text>
</svg>
