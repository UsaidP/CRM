
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <pattern id="blueprintGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(74, 144, 226, 0.12)" stroke-width="0.75"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas & Grid -->
  <rect width="1200" height="900" fill="#0a192f"/>
  <rect width="1200" height="900" fill="url(#blueprintGrid)"/>

  <!-- Title Header & Stamp -->
  <g transform="translate(60, 60)">
    <text x="0" y="30" fill="#c6a869" font-family="sans-serif" font-size="24" font-weight="900" letter-spacing="1">
      1 BHK PREMIUM RESIDENCE
    </text>
    <text x="0" y="55" fill="#e6f1ff" font-family="sans-serif" font-size="14" opacity="0.8">
      425 Sq. Ft. RERA Carpet Area • City Avenue
    </text>
    <rect x="0" y="68" width="300" height="2" fill="#c6a869"/>
  </g>

  <!-- Stamp Badge -->
  <g transform="translate(900, 50)">
    <rect width="240" height="70" fill="rgba(198, 168, 105, 0.1)" stroke="#c6a869" stroke-width="1.5" rx="8"/>
    <text x="120" y="30" text-anchor="middle" fill="#c6a869" font-family="sans-serif" font-size="11" font-weight="bold" letter-spacing="1.5">
      ARCHITECTURAL LAYOUT
    </text>
    <text x="120" y="50" text-anchor="middle" fill="#e6f1ff" font-family="monospace" font-size="12" font-weight="bold">
      ZAMZAM VERIFIED
    </text>
  </g>

  <!-- Main Blueprint Layout Outline -->
  <g transform="translate(150, 160)">
    <!-- Outer Perimeter Walls -->
    <rect x="0" y="0" width="900" height="620" fill="none" stroke="#4a90e2" stroke-width="4" rx="4"/>
    <rect x="8" y="8" width="884" height="604" fill="none" stroke="#4a90e2" stroke-width="1.5"/>

    <!-- Living & Dining Room (Center-Left) -->
    <rect x="20" y="20" width="460" height="340" fill="rgba(74, 144, 226, 0.05)" stroke="#64ffda" stroke-width="2"/>
    <text x="250" y="160" text-anchor="middle" fill="#e6f1ff" font-family="sans-serif" font-size="18" font-weight="bold">
      LIVING &amp; DINING ROOM
    </text>
    <text x="250" y="190" text-anchor="middle" fill="#64ffda" font-family="monospace" font-size="14">
      18'0" × 12'6"
    </text>

    <!-- Master Bedroom (Top-Right) -->
    <rect x="490" y="20" width="390" height="280" fill="rgba(74, 144, 226, 0.08)" stroke="#64ffda" stroke-width="2"/>
    <text x="685" y="140" text-anchor="middle" fill="#e6f1ff" font-family="sans-serif" font-size="16" font-weight="bold">
      MASTER BEDROOM
    </text>
    <text x="685" y="165" text-anchor="middle" fill="#64ffda" font-family="monospace" font-size="13">
      14'0" × 11'0"
    </text>

    <!-- Master Bathroom (En-Suite) -->
    <rect x="730" y="190" width="140" height="100" fill="rgba(100, 255, 218, 0.08)" stroke="#64ffda" stroke-width="1.5"/>
    <text x="800" y="245" text-anchor="middle" fill="#64ffda" font-family="sans-serif" font-size="11">
      MASTER BATH (8'×5')
    </text>

    <!-- Kitchen & Dry Balcony (Bottom-Left) -->
    <rect x="20" y="370" width="340" height="230" fill="rgba(74, 144, 226, 0.05)" stroke="#64ffda" stroke-width="2"/>
    <text x="190" y="470" text-anchor="middle" fill="#e6f1ff" font-family="sans-serif" font-size="16" font-weight="bold">
      MODULAR KITCHEN
    </text>
    <text x="190" y="495" text-anchor="middle" fill="#64ffda" font-family="monospace" font-size="13">
      10'6" × 8'6"
    </text>

    <!-- Dry Balcony -->
    <rect x="20" y="520" width="340" height="80" fill="rgba(100, 255, 218, 0.05)" stroke="#64ffda" stroke-dasharray="6,4" stroke-width="1.5"/>
    <text x="190" y="565" text-anchor="middle" fill="#c6a869" font-family="sans-serif" font-size="12" font-weight="bold">
      UTILITY / DRY YARD (5' WIDE)
    </text>

    <!-- Bedroom 2 / Guest Room (Bottom-Right) -->
    <rect x="490" y="310" width="390" height="290" fill="rgba(74, 144, 226, 0.05)" stroke="#64ffda" stroke-width="2"/>
    <text x="685" y="440" text-anchor="middle" fill="#e6f1ff" font-family="sans-serif" font-size="16" font-weight="bold">
      BEDROOM / STUDY
    </text>
    <text x="685" y="465" text-anchor="middle" fill="#64ffda" font-family="monospace" font-size="13">
      12'0" × 10'6"
    </text>

    <!-- Common Bathroom -->
    <rect x="370" y="370" width="110" height="150" fill="rgba(100, 255, 218, 0.08)" stroke="#64ffda" stroke-width="1.5"/>
    <text x="425" y="445" text-anchor="middle" fill="#64ffda" font-family="sans-serif" font-size="11">
      BATH (7'×4.5')
    </text>

    <!-- French Window / Valley View Balcony (Top) -->
    <rect x="60" y="0" width="380" height="20" fill="#c6a869" opacity="0.3"/>
    <text x="250" y="14" text-anchor="middle" fill="#c6a869" font-family="sans-serif" font-size="10" font-weight="bold">
      SUNDECK BALCONY (VALLEY FACING)
    </text>
  </g>
</svg>
